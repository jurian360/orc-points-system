<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SARK — Surinaamse Auto Rally Klub">
  <defs>
    <radialGradient id="sarkGradient" cx="50%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#FFDD5C"/>
      <stop offset="55%" stop-color="#FBA919"/>
      <stop offset="100%" stop-color="#F0631A"/>
    </radialGradient>
    <path id="sarkTopArc" d="M 22,102 A 78,78 0 0 1 178,102" fill="none"/>
    <path id="sarkBottomArc" d="M 28,126 A 78,78 0 0 0 172,126" fill="none"/>
  </defs>

  <circle cx="100" cy="100" r="98" fill="#E5341C"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#FFD54A" stroke-width="3"/>
  <circle cx="100" cy="100" r="86" fill="url(#sarkGradient)"/>

  <text font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="14.5" fill="#ffffff" letter-spacing="1.4">
    <textPath href="#sarkTopArc" startOffset="50%" text-anchor="middle">SURINAAMSE</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13.5" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#sarkBottomArc" startOffset="50%" text-anchor="middle">AUTO RALLY KLUB</textPath>
  </text>

  <!-- steering wheel -->
  <g transform="translate(100,66)" stroke="#1a1a1a" stroke-width="3.2" fill="none" stroke-linecap="round">
    <circle r="13"/>
    <line x1="0" y1="-13" x2="0" y2="1"/>
    <line x1="0" y1="1" x2="-11.5" y2="8"/>
    <line x1="0" y1="1" x2="11.5" y2="8"/>
    <circle r="2.6" fill="#1a1a1a" stroke="none"/>
  </g>

  <!-- SARK wordmark -->
  <text x="100" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900"
    font-size="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" paint-order="stroke" letter-spacing="1">SARK</text>

  <!-- crossed checkered flags -->
  <g transform="translate(100,152)">
    <g transform="rotate(-24)">
      <rect x="-1.2" y="-2" width="2.4" height="24" fill="#1a1a1a"/>
      <path d="M -1.2,-8 h17 v11 h-17 z" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.6"/>
      <g fill="#1a1a1a">
        <rect x="-1.2" y="-8" width="4.25" height="3.7"/>
        <rect x="7.3" y="-8" width="4.25" height="3.7"/>
        <rect x="3.05" y="-4.3" width="4.25" height="3.7"/>
        <rect x="11.55" y="-4.3" width="4.25" height="3.7"/>
      </g>
    </g>
    <g transform="scale(-1,1) rotate(-24)">
      <rect x="-1.2" y="-2" width="2.4" height="24" fill="#1a1a1a"/>
      <path d="M -1.2,-8 h17 v11 h-17 z" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.6"/>
      <g fill="#1a1a1a">
        <rect x="-1.2" y="-8" width="4.25" height="3.7"/>
        <rect x="7.3" y="-8" width="4.25" height="3.7"/>
        <rect x="3.05" y="-4.3" width="4.25" height="3.7"/>
        <rect x="11.55" y="-4.3" width="4.25" height="3.7"/>
      </g>
    </g>
  </g>
</svg>
